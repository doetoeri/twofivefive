<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>글래스모피즘 타이머</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <div class="glass-container">
    <div class="timer-display">
      <h2 class="mode-label">공부 시간</h2>
      <div class="time">25:00</div>
    </div>
    <div class="controls">
      <button class="glass-btn" id="startPauseBtn">
        <i class="fas fa-play"></i>
      </button>
      <button class="glass-btn" id="resetBtn">
        <i class="fas fa-redo"></i>
      </button>
    </div>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="0">공부</button>
      <button class="mode-btn" data-mode="1">휴식</button>
      <button class="mode-btn" data-mode="2">준비</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
