<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Material Timer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 구글 머티리얼 아이콘 -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="material-card">
    <div class="timer-display">
      <h2 class="mode-label">공부 시간</h2>
      <div class="time">25:00</div>
    </div>
    <div class="controls">
      <button class="material-btn" id="startPauseBtn">
        <span class="material-icons">play_arrow</span>
      </button>
      <button class="material-btn" id="resetBtn">
        <span class="material-icons">replay</span>
      </button>
    </div>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="0">공부</button>
      <button class="mode-btn" data-mode="1">휴식</button>
      <button class="mode-btn" data-mode="2">준비</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
